<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Credit Book - three-tier architecture on AWS</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <rect width="1000" height="580" fill="#ffffff"/>
  <text x="20" y="28" font-size="18" font-weight="700" fill="#111827">Credit Book: three-tier architecture on AWS</text>

  <!-- AWS cloud -->
  <rect x="160" y="44" width="820" height="500" rx="12" fill="#FAFAFA" stroke="#232F3E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="176" y="66" font-size="13" font-weight="600" fill="#232F3E">AWS Cloud  |  ap-southeast-2 (Sydney)</text>

  <!-- VPC -->
  <rect x="230" y="84" width="500" height="440" rx="10" fill="#FBF8FF" stroke="#8C4FFF" stroke-width="2"/>
  <text x="246" y="106" font-size="13" font-weight="600" fill="#6B35C9">VPC  credit-book-vpc</text>

  <!-- Public subnet -->
  <rect x="270" y="124" width="440" height="150" rx="8" fill="#EEF6E4" stroke="#7AA116" stroke-width="1.5"/>
  <text x="286" y="146" font-size="12" font-weight="600" fill="#4D6B0D">Public subnet</text>
  <rect x="290" y="158" width="400" height="102" rx="8" fill="#FFF3E0" stroke="#ED7100" stroke-width="2"/>
  <text x="490" y="184" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">EC2 instance (Amazon Linux 2023)</text>
  <text x="490" y="205" font-size="13" fill="#1F2937" text-anchor="middle">Docker container: Gunicorn + Flask</text>
  <text x="490" y="224" font-size="13" fill="#1F2937" text-anchor="middle">Serves the website and the REST API</text>
  <text x="490" y="248" font-size="11.5" font-style="italic" fill="#6B4A1E" text-anchor="middle">Security group backend-sg: port 80 from my IP only</text>

  <!-- Private subnets -->
  <rect x="270" y="344" width="440" height="150" rx="8" fill="#E6F2F8" stroke="#147EBA" stroke-width="1.5"/>
  <text x="286" y="366" font-size="12" font-weight="600" fill="#0F5E8C">Private subnets (2 AZs)</text>
  <rect x="290" y="378" width="400" height="102" rx="8" fill="#E8EAF6" stroke="#3B48CC" stroke-width="2"/>
  <text x="490" y="404" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">RDS for MySQL 8.4</text>
  <text x="490" y="425" font-size="13" fill="#1F2937" text-anchor="middle">No public access</text>
  <text x="490" y="444" font-size="13" fill="#1F2937" text-anchor="middle">Tables: users, customers, entries</text>
  <text x="490" y="468" font-size="11.5" font-style="italic" fill="#2A3480" text-anchor="middle">Security group database-sg: 3306 from backend-sg only</text>

  <!-- Browser and Internet Gateway -->
  <rect x="20" y="182" width="120" height="54" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
  <text x="80" y="206" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">Browser</text>
  <text x="80" y="224" font-size="11.5" fill="#374151" text-anchor="middle">my IP only</text>
  <rect x="190" y="182" width="80" height="54" rx="8" fill="#EFE7FF" stroke="#8C4FFF" stroke-width="1.5"/>
  <text x="230" y="206" font-size="12" font-weight="700" fill="#111827" text-anchor="middle">Internet</text>
  <text x="230" y="222" font-size="12" font-weight="700" fill="#111827" text-anchor="middle">Gateway</text>

  <!-- solid traffic arrows -->
  <line x1="140" y1="209" x2="188" y2="209" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <text x="164" y="172" font-size="11" fill="#374151" text-anchor="middle">HTTP 80</text>
  <line x1="270" y1="209" x2="288" y2="209" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="490" y1="260" x2="490" y2="376" stroke="#374151" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="500" y="316" font-size="12" font-weight="600" fill="#374151">MySQL 3306</text>
  <text x="500" y="332" font-size="11" fill="#6B7280">only from backend-sg</text>

  <!-- AWS services -->
  <g stroke="#5A6B86" stroke-width="1.5" fill="#F3F4F6">
    <rect x="770" y="100" width="190" height="56" rx="8"/>
    <rect x="770" y="180" width="190" height="56" rx="8"/>
    <rect x="770" y="260" width="190" height="56" rx="8"/>
    <rect x="770" y="340" width="190" height="56" rx="8"/>
    <rect x="770" y="420" width="190" height="56" rx="8" fill="#FFF8E1" stroke="#B7791F"/>
  </g>
  <g font-size="13" font-weight="700" fill="#111827" text-anchor="middle">
    <text x="865" y="124">SSM Parameter Store</text>
    <text x="865" y="204">CloudWatch Logs</text>
    <text x="865" y="284">CloudWatch Alarm + SNS</text>
    <text x="865" y="364">Session Manager</text>
    <text x="865" y="444">IAM role</text>
  </g>
  <g font-size="11.5" fill="#374151" text-anchor="middle">
    <text x="865" y="143">DB password, JWT secret</text>
    <text x="865" y="223">7-day retention</text>
    <text x="865" y="303">email if EC2 status fails</text>
    <text x="865" y="383">admin access, no SSH</text>
    <text x="865" y="463">ec2-backend-role, least privilege</text>
  </g>

  <!-- dashed service calls -->
  <g fill="none" stroke="#374151" stroke-width="1.6" stroke-dasharray="5 4">
    <path d="M690,172 C735,172 735,128 768,128" marker-end="url(#arr)"/>
    <path d="M690,196 C735,196 735,208 768,208" marker-end="url(#arr)"/>
    <path d="M690,222 C735,222 735,288 768,288" marker-end="url(#arr)"/>
    <path d="M770,368 C735,368 735,246 692,246" marker-end="url(#arr)"/>
  </g>

  <!-- legend -->
  <line x1="772" y1="505" x2="806" y2="505" stroke="#374151" stroke-width="2"/>
  <text x="814" y="509" font-size="11.5" fill="#374151">Network traffic</text>
  <line x1="772" y1="525" x2="806" y2="525" stroke="#374151" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="814" y="529" font-size="11.5" fill="#374151">AWS service calls</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
