<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Credit Book</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f6f8; margin: 0; }
    .card { max-width: 360px; margin: 60px auto; background: #fff; padding: 24px;
            border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
    h1 { margin-top: 0; }
    input { width: 100%; padding: 10px; margin: 6px 0 14px; box-sizing: border-box;
            border: 1px solid #ccc; border-radius: 6px; font-size: 16px; }
    button { padding: 10px 16px; border: 0; border-radius: 6px; font-size: 16px;
             cursor: pointer; margin-right: 8px; }
    .primary { background: #2563eb; color: #fff; }
    .secondary { background: #e5e7eb; }
    #msg { margin-top: 14px; color: #b91c1c; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Credit Book</h1>

    <div id="login-box">
      <label>Email</label>
      <input id="email" type="email" autocomplete="username">
      <label>Password</label>
      <input id="password" type="password" autocomplete="current-password">
      <button class="primary" onclick="send('/api/login')">Log in</button>
      <button class="secondary" onclick="send('/api/signup')">Sign up</button>
    </div>

    <div id="home-box" class="hidden">
      <p id="welcome"></p>
      <button class="secondary" onclick="logout()">Log out</button>
    </div>

    <div id="msg"></div>
  </div>

  <script>
    const msg = document.getElementById("msg");

    async function send(path) {
      msg.textContent = "";
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      try {
        const res = await fetch(path, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: email, password: password })
        });
        const data = await res.json();
        if (!res.ok) {
          msg.textContent = data.error || "Something went wrong";
          return;
        }
        if (path === "/api/login") {
          localStorage.setItem("token", data.token);
          showHome();
        } else {
          msg.textContent = "Account created. Now click Log in.";
        }
      } catch (e) {
        msg.textContent = "Cannot reach the server.";
      }
    }

    async function showHome() {
      const token = localStorage.getItem("token");
      if (!token) return;
      const res = await fetch("/api/me", {
        headers: { "Authorization": "Bearer " + token }
      });
      if (!res.ok) { logout(); return; }
      const data = await res.json();
      document.getElementById("welcome").textContent =
        "Logged in as " + (data.email || "you");
      document.getElementById("login-box").classList.add("hidden");
      document.getElementById("home-box").classList.remove("hidden");
      msg.textContent = "";
    }

    function logout() {
      localStorage.removeItem("token");
      document.getElementById("home-box").classList.add("hidden");
      document.getElementById("login-box").classList.remove("hidden");
    }

    showHome();
  </script>
</body>
</html>
