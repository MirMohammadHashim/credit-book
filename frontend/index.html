<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Credit Book</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="bar">
    <span class="brand">Credit Book</span>
    <span id="who" class="who hidden">
      <span id="who-email"></span>
      <button id="logout" class="btn small secondary">Log out</button>
    </span>
  </header>

  <main class="card">

    <!-- Login / Sign up -->
    <section id="view-login" class="hidden">
      <h2>Welcome</h2>
      <p class="muted">Keep track of what your customers owe you.</p>
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username">
      <label for="password">Password (8 to 72 characters)</label>
      <input id="password" type="password" autocomplete="current-password">
      <div class="actions">
        <button id="btn-login" class="btn primary">Log in</button>
        <button id="btn-signup" class="btn secondary">Sign up</button>
      </div>
    </section>

    <!-- Customer list -->
    <section id="view-list" class="hidden">
      <div class="summary">
        <div class="muted">Total to collect</div>
        <div id="total" class="big">0.00</div>
      </div>

      <h2>Your customers</h2>
      <div id="list"></div>

      <h3>Add customer</h3>
      <label for="cname">Name</label>
      <input id="cname" maxlength="100">
      <label for="cphone">Phone (optional)</label>
      <input id="cphone" maxlength="20" inputmode="tel">
      <button id="btn-add-customer" class="btn primary">Add customer</button>
    </section>

    <!-- One customer -->
    <section id="view-customer" class="hidden">
      <a href="#/" class="back">&larr; All customers</a>
      <h2 id="c-name"></h2>
      <div id="c-phone" class="muted"></div>
      <div class="summary">
        <div class="muted" id="c-balance-label">Balance</div>
        <div id="c-balance" class="big">0.00</div>
      </div>

      <h3>Add entry</h3>
      <label for="etype">What happened?</label>
      <select id="etype">
        <option value="credit">Gave goods on credit (udhaar)</option>
        <option value="payment">Received a payment</option>
      </select>
      <label for="eamount">Amount</label>
      <input id="eamount" inputmode="decimal" placeholder="e.g. 250.50">
      <label for="enote">Note (optional)</label>
      <input id="enote" maxlength="255">
      <label for="edate">Date</label>
      <input id="edate" type="date">
      <button id="btn-add-entry" class="btn primary">Save entry</button>

      <h3>History</h3>
      <div id="entries"></div>
    </section>

    <div id="msg" class="msg" role="alert"></div>
  </main>

  <script src="/app.js"></script>
</body>
</html>
